<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Home dashboard</title>
<meta name="description" content="Integrated dashboard widget for Notion: location, clock, date, focus timer" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Home dashboard" />
<meta property="og:url" content="https://haroonali7816.github.io/notion-widgets/hero/" />
<meta name="twitter:card" content="player" />
<meta name="twitter:title" content="Home dashboard" />
<meta name="twitter:player" content="https://haroonali7816.github.io/notion-widgets/hero/" />
<meta name="twitter:player:width" content="1000" />
<meta name="twitter:player:height" content="540" />
<link rel="alternate" type="application/json+oembed" href="https://haroonali7816.github.io/notion-widgets/hero/oembed.json" title="Home dashboard" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  /* Palette: graphite + chartreuse, with moss / stone / clay tile tints. */
  :root {
    --bg: #F2EFE7; --panel: #FBF9F4; --panel-2: #EEF1E4; --panel-3: #F3EEE6;
    --line: rgba(28,30,25,.10); --text: #1C1E19; --muted: #6B6F64;
    --accent: #4E7A1F; --accent-ink: #FBF9F4; --accent-soft: #DCEFA0;
    --tick: rgba(28,30,25,.28); --hand: #1C1E19;
    --map-filter: invert(1) grayscale(1) sepia(.3) hue-rotate(40deg) saturate(.7) contrast(.85) brightness(1.04);
    --map-fade: linear-gradient(90deg, rgba(251,249,244,.95) 0%, rgba(251,249,244,.72) 45%, rgba(251,249,244,0) 100%);
    --glow: radial-gradient(1200px 400px at 0% 0%, rgba(78,122,31,.10), transparent 60%);
  }
  :root[data-theme="dark"] {
    --bg: #0E100E; --panel: #161915; --panel-2: #181E16; --panel-3: #1C1A16;
    --line: rgba(236,232,221,.09); --text: #ECE8DD; --muted: #8D9286;
    --accent: #C6F24E; --accent-ink: #0E100E; --accent-soft: rgba(198,242,78,.13);
    --tick: rgba(236,232,221,.30); --hand: #ECE8DD;
    --map-filter: grayscale(1) sepia(.35) hue-rotate(45deg) saturate(.7) brightness(.95);
    --map-fade: linear-gradient(90deg, rgba(22,25,21,.96) 0%, rgba(22,25,21,.75) 45%, rgba(22,25,21,0) 100%);
    --glow: radial-gradient(1200px 420px at 0% 0%, rgba(198,242,78,.07), transparent 60%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: transparent; color: var(--text);
    font-family: "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    padding: 2px; overflow-y: auto; scrollbar-width: none;
  }
  body::-webkit-scrollbar { display: none; }
  .mono { font-family: "Geist Mono", ui-monospace, monospace; }
  .label { font-family: "Geist Mono", monospace; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }

  .dash { display: flex; flex-direction: column; gap: 12px; height: 100%; min-height: 500px; }

  /* Header */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 2px 4px 0; }
  .greet h1 { font-size: clamp(20px, 2.6vw, 27px); font-weight: 600; letter-spacing: -.02em; }
  .greet h1 em { font-family: "Instrument Serif", serif; font-style: italic; font-weight: 400; font-size: 1.12em; color: var(--accent); }
  .greet p { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .today-chip { font: 500 12px 'Geist Mono', monospace; color: var(--muted); padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); }
  .nav { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px; padding: 8px 13px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); font-size: 13px; font-weight: 500;
    transition: transform .15s, border-color .15s, background .15s;
  }
  .pill:hover { transform: translateY(-1px); border-color: var(--accent); }
  .pill .k { font: 500 10px "Geist Mono", monospace; color: var(--muted); }
  .pill.main { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .pill.main .k { color: inherit; opacity: .7; }

  /* Grid */
  .grid {
    flex: 1; display: grid; gap: 12px; min-height: 0;
    grid-template-columns: 1.55fr 1fr 1fr;
    grid-template-rows: minmax(190px, 1fr) minmax(150px, .8fr);
    grid-template-areas: "map clock date" "map focus focus";
  }
  .tile {
    position: relative; background: var(--panel); border: 1px solid var(--line);
    border-radius: 18px; overflow: hidden; min-width: 0;
    transition: border-color .2s, transform .2s;
  }
  .tile:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .tile .head { position: absolute; top: 14px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; z-index: 5; pointer-events: none; }
  .tile .head > * { pointer-events: auto; }
  .hint { font: 10px "Geist Mono", monospace; color: var(--muted); opacity: 0; transition: opacity .2s; }
  .tile:hover .hint { opacity: .85; }

  /* Map tile */
  .t-map { grid-area: map; }
  #map { position: absolute; inset: 0; z-index: 0; background: var(--panel); }
  #map .leaflet-tile-pane { filter: var(--map-filter); }
  .leaflet-container { background: var(--panel); font-family: inherit; }
  .leaflet-control-attribution { font-size: 8.5px !important; background: transparent !important; color: var(--muted) !important; }
  .leaflet-control-attribution a { color: var(--muted) !important; }
  .fade { position: absolute; inset: 0; z-index: 400; background: var(--map-fade); pointer-events: none; }
  .scan { position: absolute; top: 0; bottom: 0; width: 1px; z-index: 401; pointer-events: none; background: var(--accent); box-shadow: 0 0 18px 3px var(--accent); opacity: 0; animation: scan 7s cubic-bezier(.5,0,.5,1) infinite; }
  @keyframes scan { 0%{left:-2%;opacity:0} 12%{opacity:.5} 88%{opacity:.5} 100%{left:102%;opacity:0} }
  .loc { position: relative; z-index: 402; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 18px 20px; pointer-events: none; max-width: 70%; }
  .live { display: inline-flex; align-items: center; gap: 8px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); position: relative; }
  .dot::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 1px solid var(--accent); animation: ping 2s ease-out infinite; }
  @keyframes ping { 0%{transform:scale(.4);opacity:1} 100%{transform:scale(1.6);opacity:0} }
  .city { font-size: clamp(22px, 3vw, 34px); font-weight: 600; letter-spacing: -.02em; line-height: 1.05; margin-top: 10px; }
  .coords { font: 12px "Geist Mono", monospace; color: var(--muted); margin-top: 6px; }
  .loc-bottom { display: flex; flex-direction: column; gap: 14px; }
  .loc-time { font: 500 clamp(26px, 3.4vw, 40px) "Geist Mono", monospace; letter-spacing: -.02em; line-height: 1; }
  .loc-time .s { color: var(--accent); }
  .wx-row { display: flex; gap: 20px; flex-wrap: wrap; }
  .wx-row div b { display: block; font: 500 17px "Geist Mono", monospace; margin-top: 3px; }
  .wx-row div span.v { font-size: 12.5px; color: var(--muted); }
  .recenter { position: absolute; right: 12px; top: 12px; z-index: 403; font: 500 11px "Geist Mono", monospace; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; cursor: pointer; opacity: 0; transition: opacity .2s; }
  .t-map:hover .recenter { opacity: 1; }
  .pin { position: relative; width: 14px; height: 14px; }
  .pin i { position: absolute; inset: 3px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--panel); }
  .pin::before { content: ""; position: absolute; inset: -10px; border-radius: 50%; background: var(--accent); opacity: .25; animation: ping 2.4s ease-out infinite; }

  /* Clock tile */
  .t-clock { grid-area: clock; background: var(--panel-2); cursor: pointer; user-select: none; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: center; gap: 14px; padding: 40px 16px 16px; }
  #face { width: 100%; max-width: 170px; max-height: 100%; aspect-ratio: 1; justify-self: center; }
  .clock-side { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .digital { font: 500 clamp(17px, 1.9vw, 24px) "Geist Mono", monospace; letter-spacing: -.02em; line-height: 1; white-space: nowrap; }
  .digital .sec { color: var(--accent); }
  .digital .ampm { font-size: .45em; color: var(--muted); margin-left: 4px; }
  .daybar { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .daybar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .zones { display: grid; grid-template-columns: auto auto; gap: 3px 12px; }
  .zones span { font: 11.5px "Geist Mono", monospace; }
  .zones span.k { color: var(--muted); }

  /* Date tile */
  .t-date { grid-area: date; background: var(--panel-3); cursor: pointer; user-select: none; }
  .d-front, .d-back { position: absolute; inset: 0; padding: 40px 18px 16px; transition: opacity .35s, transform .35s; }
  .d-back { opacity: 0; transform: translateY(8px); pointer-events: none; padding-top: 14px; }
  .t-date.flipped .d-front { opacity: 0; transform: translateY(-8px); pointer-events: none; }
  .t-date.flipped .d-back { opacity: 1; transform: none; pointer-events: auto; }
  .t-date.flipped .head { opacity: 0; }
  .d-front { display: flex; flex-direction: column; justify-content: space-between; }
  .d-main { display: flex; align-items: center; gap: 16px; }
  .bigday { font-family: "Instrument Serif", serif; font-size: clamp(64px, 7vw, 92px); line-height: .8; letter-spacing: -.03em; }
  .wd { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .my { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .chips { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
  .chip { font: 500 10.5px "Geist Mono", monospace; padding: 3px 7px; border-radius: 999px; border: 1px solid var(--line); }
  .chip.hl { background: var(--accent-soft); border-color: transparent; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .week span { text-align: center; font: 10.5px "Geist Mono", monospace; padding: 5px 0; border-radius: 8px; color: var(--muted); border: 1px solid transparent; }
  .week span b { display: block; font-weight: 500; color: var(--text); font-size: 12px; margin-top: 1px; }
  .week span.past { opacity: .45; }
  .week span.t { background: var(--accent); color: var(--accent-ink); }
  .week span.t b { color: var(--accent-ink); }
  .bar-row .top2 { display: flex; justify-content: space-between; margin-bottom: 5px; }
  .bar-row .top2 .mono { font-size: 11px; }
  .bar { height: 5px; border-radius: 5px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 5px; background: var(--accent); transition: width .8s cubic-bezier(.2,.8,.2,1); }
  .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .cal-head b { font-weight: 600; font-size: 14px; }
  .cal-head button { background: none; border: 1px solid var(--line); border-radius: 8px; width: 24px; height: 24px; cursor: pointer; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; text-align: center; }
  .cal span { font: 11px "Geist Mono", monospace; padding: 3px 0; border-radius: 6px; }
  .cal span.h { color: var(--muted); font-size: 9.5px; }
  .cal span.o { opacity: .3; }
  .cal span.t { background: var(--accent); color: var(--accent-ink); font-weight: 500; }

  /* Focus tile */
  .t-focus { grid-area: focus; display: flex; align-items: center; gap: 22px; padding: 16px 20px; }
  .ring { position: relative; flex: none; height: 100%; max-height: 128px; aspect-ratio: 1; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .trk { stroke: var(--line); }
  .ring .prg { stroke: var(--accent); transition: stroke-dashoffset .4s linear; }
  .ring .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring .mid b { font: 500 clamp(18px, 2vw, 24px) "Geist Mono", monospace; letter-spacing: -.02em; }
  .ring .mid span { font: 9.5px "Geist Mono", monospace; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
  .focus-body { display: flex; flex-direction: column; gap: 10px; min-width: 0; flex: 1; }
  .focus-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .focus-title h3 { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  .modes { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .modes button { border: 0; background: none; padding: 5px 11px; border-radius: 999px; font-size: 12px; cursor: pointer; color: var(--muted); }
  .modes button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .ctrls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 9px 16px; font-size: 13px; font-weight: 500; cursor: pointer; transition: transform .12s, background .15s; }
  .btn:active { transform: scale(.97); }
  .btn.go { background: var(--accent); color: var(--accent-ink); border-color: transparent; min-width: 92px; }
  .sessions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .sessions i { width: 9px; height: 9px; border-radius: 3px; background: var(--line); display: inline-block; }
  .sessions i.on { background: var(--accent); }
  .focus-note { font-size: 12px; color: var(--muted); }

  /* Responsive */
  @media (max-width: 860px) {
    .grid { grid-template-columns: 1fr 1fr; grid-template-rows: 230px 210px auto; grid-template-areas: "map map" "clock date" "focus focus"; }
    .dash { height: auto; }
  }
  @media (max-width: 520px) {
    .grid { grid-template-columns: 1fr; grid-template-rows: 230px 200px 220px auto; grid-template-areas: "map" "clock" "date" "focus"; }
    .t-focus { flex-direction: column; align-items: stretch; }
    .ring { height: 120px; align-self: center; }
  }
  @media (prefers-reduced-motion: reduce) { .scan, .dot::after, .pin::before { animation: none; } }
</style>
</head>
<body>
<div class="dash">

  <header class="top">
    <div class="greet">
      <h1><span id="hello">Good day</span>, <em id="name">Haroon</em></h1>
      <p id="sub">—</p>
    </div>
    <div class="today-chip" id="today-chip"></div>
  </header>

  <main class="grid">
    <!-- Location -->
    <section class="tile t-map">
      <div id="map"></div>
      <div class="fade"></div>
      <div class="scan"></div>
      <button class="recenter" id="recenter">⌖ recenter</button>
      <div class="loc">
        <div>
          <span class="live"><span class="dot"></span><span class="label">Based in</span></span>
          <p class="city" id="city">Saarbrücken, Germany</p>
          <p class="coords" id="coords">49.2354° N, 6.9969° E</p>
        </div>
        <div class="loc-bottom">
          <p class="loc-time" id="loc-time">--:--<span class="s">:--</span></p>
          <div class="wx-row" id="wx">
            <div><span class="label">Weather</span><b>--°</b><span class="v">loading</span></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Clock -->
    <section class="tile t-clock" id="clock" title="Click to switch 24h / 12h">
      <div class="head"><span class="label" id="clock-tag">Local time</span><span class="hint">24h / 12h</span></div>
      <svg id="face" viewBox="0 0 200 200" aria-label="Analog clock">
        <circle cx="100" cy="100" r="96" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
        <g id="ticks"></g>
        <g id="nums" font-family="Geist Mono, monospace" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="central"></g>
        <text x="100" y="134" text-anchor="middle" font-family="Geist Mono, monospace" font-size="7.5" letter-spacing="1.5" fill="var(--muted)" id="face-date"></text>
        <g id="h"><rect x="97.6" y="52" width="4.8" height="56" rx="2.4" fill="var(--hand)"/></g>
        <g id="m"><rect x="98.4" y="22" width="3.2" height="86" rx="1.6" fill="var(--hand)"/></g>
        <g id="s"><rect x="99.4" y="16" width="1.2" height="104" rx=".6" fill="var(--accent)"/><circle cx="100" cy="122" r="3.4" fill="var(--accent)"/></g>
        <circle cx="100" cy="100" r="4.2" fill="var(--accent)"/><circle cx="100" cy="100" r="1.6" fill="var(--panel)"/>
      </svg>
      <div class="clock-side">
        <div class="digital" id="digital">--:--</div>
        <div>
          <div class="label" style="display:flex;justify-content:space-between;gap:10px"><span>Day</span><span id="day-pct">--%</span></div>
          <div class="daybar" style="margin-top:5px"><i id="day-bar" style="width:0"></i></div>
        </div>
        <div class="zones" id="zones"></div>
      </div>
    </section>

    <!-- Date -->
    <section class="tile t-date" id="date" title="Click for month view">
      <div class="head"><span class="label">Today</span><span class="hint">month view</span></div>
      <div class="d-front">
        <div class="d-main">
          <div class="bigday" id="bigday">--</div>
          <div>
            <div class="wd" id="weekday">--</div>
            <div class="my" id="monthyear">--</div>
            <div class="chips"><span class="chip hl" id="kw">KW --</span><span class="chip" id="doy">Day ---</span></div>
          </div>
        </div>
        <div class="week" id="week"></div>
        <div class="bar-row">
          <div class="top2"><span class="label" id="sem-name">Semester</span><span class="mono" id="sem-pct">--%</span></div>
          <div class="bar"><i id="sem-bar" style="width:0"></i></div>
        </div>
      </div>
      <div class="d-back">
        <div class="cal-head"><button id="prev" aria-label="Previous month">‹</button><b id="cal-title">--</b><button id="next" aria-label="Next month">›</button></div>
        <div class="cal" id="cal"></div>
      </div>
    </section>

    <!-- Focus timer -->
    <section class="tile t-focus">
      <div class="ring">
        <svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="52" fill="none" stroke-width="7"/><circle class="prg" id="prg" cx="60" cy="60" r="52" fill="none" stroke-width="7" stroke-linecap="round"/></svg>
        <div class="mid"><b id="ft">25:00</b><span id="fm">focus</span></div>
      </div>
      <div class="focus-body">
        <div class="focus-title">
          <h3>Focus timer</h3>
          <div class="modes" id="modes">
            <button data-m="focus" class="on">Focus 25</button><button data-m="short">Break 5</button><button data-m="long">Long 15</button>
          </div>
        </div>
        <div class="ctrls">
          <button class="btn go" id="go">Start</button>
          <button class="btn" id="reset">Reset</button>
          <div class="sessions" title="Focus sessions today"><span class="label">Today</span><span id="dots"></span></div>
        </div>
        <p class="focus-note" id="fnote">Pick one task from your To-Do list below and start a 25-minute block.</p>
      </div>
    </section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* URL options: ?theme=light|dark  &name=Haroon  &city=..&lat=..&lon=..  &tz=Europe/Berlin  &zones=Asia/Karachi */
const q = new URLSearchParams(location.search);
const theme = q.get('theme') || 'dark';
document.documentElement.dataset.theme = theme;
const TZ = q.get('tz') || 'Europe/Berlin';
const pad = n => String(n).padStart(2, '0');
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
function partsIn(tz, d = new Date()) {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour12: false, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', weekday: 'long' }).formatToParts(d).map(x => [x.type, x.value]));
  return { y: +p.year, mo: +p.month, d: +p.day, h: +p.hour % 24, m: +p.minute, s: +p.second, wd: p.weekday };
}
function tzAbbr(tz) { try { return new Intl.DateTimeFormat('en-GB', { timeZone: tz, timeZoneName: 'short' }).formatToParts(new Date()).find(p => p.type === 'timeZoneName').value; } catch { return ''; } }

/* ---------- Header: greeting ---------- */
if (q.get('name')) document.getElementById('name').textContent = q.get('name');
function greet() {
  const p = partsIn(TZ);
  const h = p.h;
  document.getElementById('hello').textContent = h < 5 ? 'Late night' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : h < 22 ? 'Good evening' : 'Late night';
  const d = new Date(Date.UTC(p.y, p.mo - 1, p.d));
  document.getElementById('sub').textContent =
    `${p.wd}, ${d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', timeZone: 'UTC' })} · ${semInfo(p).left} days left in ${semInfo(p).name}`;
}

/* ---------- Semester ---------- */
function semInfo(p) {
  let s0, s1, name;
  if (p.mo >= 10 || p.mo <= 3) { const sy = p.mo >= 10 ? p.y : p.y - 1; s0 = Date.UTC(sy, 9, 1); s1 = Date.UTC(sy + 1, 2, 31); name = `WS ${String(sy).slice(2)}/${String(sy + 1).slice(2)}`; }
  else { s0 = Date.UTC(p.y, 3, 1); s1 = Date.UTC(p.y, 8, 30); name = `SS ${String(p.y).slice(2)}`; }
  const t = Date.UTC(p.y, p.mo - 1, p.d);
  return { name, pct: Math.max(0, Math.min(100, Math.round((t - s0) / (s1 - s0) * 100))), left: Math.max(0, Math.round((s1 - t) / 864e5)) };
}

/* ---------- Location ---------- */
(() => {
  const lat = parseFloat(q.get('lat') || '49.2354'), lon = parseFloat(q.get('lon') || '6.9969');
  if (q.get('city')) document.getElementById('city').textContent = q.get('city');
  document.getElementById('coords').textContent = `${Math.abs(lat).toFixed(4)}° ${lat >= 0 ? 'N' : 'S'}, ${Math.abs(lon).toFixed(4)}° ${lon >= 0 ? 'E' : 'W'}`;
  const start = [lat, lon - 0.03];
  const map = L.map('map', { zoomControl: false, scrollWheelZoom: false, zoomSnap: .5 }).setView(start, 13);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16, attribution: 'Tiles © Esri' }).addTo(map);
  L.marker([lat, lon], { icon: L.divIcon({ className: '', html: '<div class="pin"><i></i></div>', iconSize: [14, 14], iconAnchor: [7, 7] }) }).addTo(map);
  document.getElementById('recenter').onclick = () => map.flyTo(start, 13, { duration: .8 });
  new ResizeObserver(() => map.invalidateSize()).observe(document.getElementById('map'));

  const tEl = document.getElementById('loc-time');
  const tick = () => { const p = partsIn(TZ); tEl.innerHTML = `${pad(p.h)}:${pad(p.m)}<span class="s">:${pad(p.s)}</span>`; };
  tick(); setInterval(tick, 1000);

  const WMO = {0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',51:'Drizzle',53:'Drizzle',55:'Drizzle',56:'Freezing drizzle',57:'Freezing drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',80:'Showers',81:'Showers',82:'Heavy showers',85:'Snow showers',86:'Snow showers',95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'};
  const wx = async () => {
    const el = document.getElementById('wx');
    try {
      const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,wind_speed_10m&daily=sunset,temperature_2m_max,temperature_2m_min&forecast_days=1&timezone=auto`);
      const j = await r.json(); if (!j.current) throw 0;
      const c = j.current, dly = j.daily;
      el.innerHTML = `
        <div><span class="label">Now</span><b>${Math.round(c.temperature_2m)}°</b><span class="v">${WMO[c.weather_code] || ''}</span></div>
        <div><span class="label">High / Low</span><b>${Math.round(dly.temperature_2m_max[0])}° / ${Math.round(dly.temperature_2m_min[0])}°</b><span class="v">${Math.round(c.wind_speed_10m)} km/h wind</span></div>
        <div><span class="label">Sunset</span><b>${dly.sunset[0].slice(11, 16)}</b><span class="v">${tzAbbr(TZ)}</span></div>`;
    } catch {
      el.innerHTML = `<div><span class="label">Timezone</span><b>${tzAbbr(TZ)}</b><span class="v">Europe/Berlin</span></div>`;
    }
  };
  wx(); setInterval(wx, 15 * 60 * 1000);
})();

/* ---------- Clock ---------- */
(() => {
  const NS = 'http://www.w3.org/2000/svg', ticks = document.getElementById('ticks'), nums = document.getElementById('nums');
  for (let i = 0; i < 60; i++) {
    const mj = i % 5 === 0, l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', 100); l.setAttribute('x2', 100); l.setAttribute('y1', mj ? 9 : 10); l.setAttribute('y2', mj ? 19 : 14);
    l.setAttribute('stroke', mj ? 'var(--hand)' : 'var(--tick)'); l.setAttribute('stroke-width', mj ? 2.2 : 1); l.setAttribute('stroke-linecap', 'round');
    l.setAttribute('transform', `rotate(${i * 6} 100 100)`); ticks.appendChild(l);
  }
  [[12, 0], [3, 90], [6, 180], [9, 270]].forEach(([n, a]) => {
    const r = 70, rad = (a - 90) * Math.PI / 180, t = document.createElementNS(NS, 'text');
    t.setAttribute('x', 100 + r * Math.cos(rad)); t.setAttribute('y', 100 + r * Math.sin(rad)); t.textContent = pad(n); nums.appendChild(t);
  });
  const zones = (q.get('zones') || '').split(',').filter(Boolean);
  document.getElementById('clock-tag').textContent = `Local · ${tzAbbr(TZ)}`;
  let h12 = store.get('h12', false), last = -1;
  document.getElementById('clock').onclick = () => { h12 = !h12; store.set('h12', h12); last = -1; };
  const H = document.getElementById('h'), M = document.getElementById('m'), S = document.getElementById('s');
  const frame = () => {
    const now = new Date(), p = partsIn(TZ, now), sec = p.s + now.getMilliseconds() / 1000, min = p.m + sec / 60, hr = (p.h % 12) + min / 60;
    S.setAttribute('transform', `rotate(${sec * 6} 100 100)`); M.setAttribute('transform', `rotate(${min * 6} 100 100)`); H.setAttribute('transform', `rotate(${hr * 30} 100 100)`);
    if (p.s !== last) {
      last = p.s;
      let hh = p.h, suf = ''; if (h12) { suf = hh >= 12 ? 'PM' : 'AM'; hh = hh % 12 || 12; }
      document.getElementById('digital').innerHTML = `${pad(hh)}:${pad(p.m)}<span class="sec">:${pad(p.s)}</span>${suf ? `<span class="ampm">${suf}</span>` : ''}`;
      document.getElementById('face-date').textContent = `${p.wd.slice(0, 3).toUpperCase()} ${pad(p.d)}`;
      const dp = Math.round((p.h * 3600 + p.m * 60 + p.s) / 864);
      document.getElementById('day-pct').textContent = dp + '%'; document.getElementById('day-bar').style.width = dp + '%';
      document.getElementById('zones').innerHTML = zones.map(z => { const zp = partsIn(z, now); return `<span class="k">${z.split('/').pop().replace(/_/g, ' ')}</span><span>${pad(zp.h)}:${pad(zp.m)}</span>`; }).join('');
      if (p.s === 0) greet();
    }
    requestAnimationFrame(frame);
  };
  frame();
})();

/* ---------- Date ---------- */
(() => {
  const tile = document.getElementById('date');
  tile.addEventListener('click', e => { if (!e.target.closest('button')) tile.classList.toggle('flipped'); });
  let p;
  const render = () => {
    p = partsIn(TZ);
    const today = new Date(Date.UTC(p.y, p.mo - 1, p.d));
    document.getElementById('bigday').textContent = pad(p.d);
    document.getElementById('weekday').textContent = p.wd;
    document.getElementById('monthyear').textContent = today.toLocaleDateString('en-GB', { month: 'long', year: 'numeric', timeZone: 'UTC' });
    const t = new Date(today), dn = (t.getUTCDay() + 6) % 7; t.setUTCDate(t.getUTCDate() - dn + 3);
    const fy = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
    document.getElementById('kw').textContent = `KW ${1 + Math.round(((t - fy) / 864e5 - 3 + ((fy.getUTCDay() + 6) % 7)) / 7)}`;
    document.getElementById('doy').textContent = `Day ${Math.floor((today - Date.UTC(p.y, 0, 1)) / 864e5) + 1}`;
    const dow = (today.getUTCDay() + 6) % 7, names = ['Mo','Tu','We','Th','Fr','Sa','Su'];
    document.getElementById('week').innerHTML = names.map((n, i) => {
      const d = new Date(today); d.setUTCDate(d.getUTCDate() - dow + i);
      return `<span class="${i === dow ? 't' : i < dow ? 'past' : ''}">${n}<b>${d.getUTCDate()}</b></span>`;
    }).join('');
    const s = semInfo(p);
    document.getElementById('sem-name').textContent = `${s.name} · ${s.left}d left`;
    document.getElementById('sem-pct').textContent = s.pct + '%';
    document.getElementById('sem-bar').style.width = s.pct + '%';
    greet();
  };
  render(); setInterval(render, 60 * 1000);
  let cy = p.y, cm = p.mo - 1;
  const draw = () => {
    const first = new Date(Date.UTC(cy, cm, 1));
    document.getElementById('cal-title').textContent = first.toLocaleDateString('en-GB', { month: 'long', year: 'numeric', timeZone: 'UTC' });
    const sd = (first.getUTCDay() + 6) % 7, days = new Date(Date.UTC(cy, cm + 1, 0)).getUTCDate(), pd = new Date(Date.UTC(cy, cm, 0)).getUTCDate();
    let h = ['M','T','W','T','F','S','S'].map(d => `<span class="h">${d}</span>`).join('');
    for (let i = sd; i > 0; i--) h += `<span class="o">${pd - i + 1}</span>`;
    for (let d = 1; d <= days; d++) h += `<span class="${d === p.d && cm === p.mo - 1 && cy === p.y ? 't' : ''}">${d}</span>`;
    for (let d = 1; d <= (7 - ((sd + days) % 7)) % 7; d++) h += `<span class="o">${d}</span>`;
    document.getElementById('cal').innerHTML = h;
  };
  draw();
  document.getElementById('prev').onclick = e => { e.stopPropagation(); if (--cm < 0) { cm = 11; cy--; } draw(); };
  document.getElementById('next').onclick = e => { e.stopPropagation(); if (++cm > 11) { cm = 0; cy++; } draw(); };
})();

/* ---------- Focus timer (Pomodoro) ---------- */
(() => {
  const MODES = { focus: [25, 'focus'], short: [5, 'break'], long: [15, 'long break'] };
  const C = 2 * Math.PI * 52, prg = document.getElementById('prg');
  prg.style.strokeDasharray = C;
  const todayKey = () => { const p = partsIn(TZ); return `${p.y}-${p.mo}-${p.d}`; };
  let st = store.get('focus', null);
  if (!st) st = { mode: 'focus', endsAt: null, remaining: 25 * 60, running: false };
  let sessions = store.get('sessions', { day: todayKey(), n: 0 });
  if (sessions.day !== todayKey()) sessions = { day: todayKey(), n: 0 };
  const total = () => MODES[st.mode][0] * 60;
  const left = () => st.running ? Math.max(0, Math.round((st.endsAt - Date.now()) / 1000)) : st.remaining;
  const save = () => { store.set('focus', st); store.set('sessions', sessions); };
  const chime = () => {
    try {
      const a = new (window.AudioContext || window.webkitAudioContext)();
      [660, 880, 990].forEach((f, i) => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = f; o.type = 'sine';
        g.gain.setValueAtTime(0.0001, a.currentTime + i * .18); g.gain.exponentialRampToValueAtTime(.2, a.currentTime + i * .18 + .02);
        g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + i * .18 + .5); o.connect(g).connect(a.destination); o.start(a.currentTime + i * .18); o.stop(a.currentTime + i * .18 + .55); });
    } catch {}
  };
  const notes = { focus: 'Pick one task from your To-Do list below and start a 25-minute block.', short: 'Stand up, stretch, drink water.', long: 'Nice streak. Take a proper break.' };
  const paint = () => {
    const l = left();
    document.getElementById('ft').textContent = `${pad(Math.floor(l / 60))}:${pad(l % 60)}`;
    document.getElementById('fm').textContent = st.running ? MODES[st.mode][1] : (l === total() ? MODES[st.mode][1] : 'paused');
    prg.style.strokeDashoffset = C * (l / total());
    document.getElementById('go').textContent = st.running ? 'Pause' : (l === total() ? 'Start' : 'Resume');
    document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('on', b.dataset.m === st.mode));
    const n = Math.max(4, sessions.n);
    document.getElementById('dots').innerHTML = Array.from({ length: n }, (_, i) => `<i class="${i < sessions.n ? 'on' : ''}"></i>`).join(' ');
    if (!st.running) document.getElementById('fnote').textContent = notes[st.mode];
    document.getElementById('today-chip').textContent = st.running ? `● ${MODES[st.mode][1]} · ${pad(Math.floor(l / 60))}:${pad(l % 60)}` : `${sessions.n} focus session${sessions.n === 1 ? '' : 's'} today`;
    if (st.running && l === 0) {
      st.running = false; chime();
      if (st.mode === 'focus') { sessions.n++; st.mode = sessions.n % 4 === 0 ? 'long' : 'short'; }
      else st.mode = 'focus';
      st.remaining = total(); save(); paint();
    }
  };
  const setMode = m => { st = { mode: m, endsAt: null, remaining: MODES[m][0] * 60, running: false }; save(); paint(); };
  document.getElementById('modes').onclick = e => { const b = e.target.closest('button'); if (b) setMode(b.dataset.m); };
  document.getElementById('go').onclick = () => {
    if (st.running) { st.remaining = left(); st.running = false; }
    else { st.endsAt = Date.now() + left() * 1000; st.running = true; document.getElementById('fnote').textContent = st.mode === 'focus' ? 'Deep work. Notifications off.' : notes[st.mode]; }
    save(); paint();
  };
  document.getElementById('reset').onclick = () => setMode(st.mode);
  paint(); setInterval(paint, 500);
})();
</script>
