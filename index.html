<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard Widgets</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  /* ---------- Palette: graphite + chartreuse (dark) / paper + moss (light) ---------- */
  :root {
    --bg: #F4F1EA;
    --panel: #FBF9F4;
    --line: rgba(28, 30, 25, 0.10);
    --text: #1C1E19;
    --muted: #6B6F64;
    --accent: #4E7A1F;        /* moss */
    --accent-soft: #DCEFA0;   /* pale chartreuse fill */
    --tick: rgba(28, 30, 25, 0.28);
    --hand: #1C1E19;
    --shadow: 0 1px 2px rgba(28,30,25,.06), 0 8px 24px rgba(28,30,25,.06);
    --map-filter: invert(1) grayscale(1) sepia(.3) hue-rotate(40deg) saturate(.7) contrast(.85) brightness(1.04);
    --map-fade: linear-gradient(90deg, rgba(251,249,244,.96) 0%, rgba(251,249,244,.78) 38%, rgba(251,249,244,0) 100%);
  }
  :root[data-theme="dark"] {
    --bg: #101210;
    --panel: #171A16;
    --line: rgba(236, 232, 221, 0.10);
    --text: #ECE8DD;
    --muted: #8D9286;
    --accent: #C6F24E;        /* chartreuse */
    --accent-soft: rgba(198, 242, 78, 0.14);
    --tick: rgba(236, 232, 221, 0.30);
    --hand: #ECE8DD;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    --map-filter: grayscale(1) sepia(.35) hue-rotate(45deg) saturate(.7) brightness(.95);
    --map-fade: linear-gradient(90deg, rgba(23,26,22,.97) 0%, rgba(23,26,22,.82) 38%, rgba(23,26,22,.05) 100%);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Geist", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 8px;
    overflow: hidden;
  }
  body.embed-transparent { background: transparent; }
  .mono { font-family: "Geist Mono", ui-monospace, monospace; }
  .label {
    font-family: "Geist Mono", monospace;
    font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted);
  }
  .card {
    position: relative; height: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .widget { display: none; height: 100%; }
  .widget.on { display: block; }
  .hint {
    position: absolute; right: 14px; bottom: 11px; z-index: 5;
    font-family: "Geist Mono", monospace; font-size: 10px; color: var(--muted);
    opacity: 0; transition: opacity .25s;
    pointer-events: none;
  }
  .card:hover .hint { opacity: .8; }

  /* ---------- Location ---------- */
  #loc .card { min-height: 220px; }
  #map { position: absolute; inset: 0; z-index: 0; background: var(--panel); }
  #map .leaflet-tile-pane { filter: var(--map-filter); }
  .leaflet-container { font-family: inherit; background: var(--panel); }
  .leaflet-control-attribution {
    font-size: 8.5px !important; background: transparent !important; color: var(--muted) !important;
  }
  .leaflet-control-attribution a { color: var(--muted) !important; }
  .fade { position: absolute; inset: 0; z-index: 400; background: var(--map-fade); pointer-events: none; }
  .scan {
    position: absolute; top: 0; bottom: 0; width: 1px; z-index: 401; pointer-events: none;
    background: var(--accent); box-shadow: 0 0 18px 3px var(--accent);
    opacity: 0; animation: scan 6s cubic-bezier(.5,0,.5,1) infinite;
  }
  @keyframes scan { 0%{left:-2%;opacity:0} 12%{opacity:.55} 88%{opacity:.55} 100%{left:102%;opacity:0} }
  .loc-data {
    position: relative; z-index: 402; height: 100%;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 20px 22px; pointer-events: none; max-width: 62%;
  }
  .live { display: inline-flex; align-items: center; gap: 8px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); position: relative; }
  .dot::after {
    content: ""; position: absolute; inset: -5px; border-radius: 50%;
    border: 1px solid var(--accent); animation: ping 2s ease-out infinite;
  }
  @keyframes ping { 0%{transform:scale(.4);opacity:1} 100%{transform:scale(1.6);opacity:0} }
  .city { font-size: clamp(22px, 5.2vw, 34px); font-weight: 600; letter-spacing: -.02em; line-height: 1.05; margin-top: 10px; }
  .coords { font-family: "Geist Mono", monospace; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .loc-row { display: flex; gap: 22px; align-items: flex-end; flex-wrap: wrap; }
  .loc-time { font-family: "Geist Mono", monospace; font-size: clamp(20px, 4.4vw, 28px); font-weight: 500; letter-spacing: -.01em; }
  .loc-time .s { color: var(--accent); }
  .wx { font-size: 13px; color: var(--text); }
  .wx b { font-weight: 500; font-family: "Geist Mono", monospace; font-size: 18px; }
  .wx .label { display: block; margin-bottom: 2px; }
  .recenter {
    position: absolute; right: 12px; top: 12px; z-index: 403;
    font: 500 11px "Geist Mono", monospace; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 10px; cursor: pointer; opacity: 0; transition: opacity .2s;
  }
  .card:hover .recenter { opacity: 1; }
  .pin { position: relative; width: 14px; height: 14px; }
  .pin i { position: absolute; inset: 3px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--panel); }
  .pin::before {
    content: ""; position: absolute; inset: -10px; border-radius: 50%;
    background: var(--accent); opacity: .25; animation: ping 2.4s ease-out infinite;
  }

  /* ---------- Clock ---------- */
  #clock .card { display: flex; align-items: center; justify-content: center; gap: 26px; padding: 18px 22px; cursor: pointer; user-select: none; }
  #face { width: min(62vh, 46vw, 230px); height: auto; flex: none; }
  .clock-side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .digital { font-family: "Geist Mono", monospace; font-size: clamp(26px, 6vw, 40px); font-weight: 500; letter-spacing: -.02em; line-height: 1; }
  .digital .ampm { font-size: .42em; color: var(--muted); margin-left: 6px; letter-spacing: .08em; }
  .digital .sec { color: var(--accent); }
  .zones { display: grid; grid-template-columns: auto auto; gap: 4px 14px; margin-top: 4px; }
  .zones span { font-family: "Geist Mono", monospace; font-size: 12px; }
  .zones span.k { color: var(--muted); }
  .daybar { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 4px; }
  .daybar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  @media (max-width: 420px) { .clock-side { display: none; } }

  /* ---------- Date ---------- */
  #date .card { cursor: pointer; user-select: none; }
  .date-front, .date-back { position: absolute; inset: 0; padding: 18px 22px; transition: opacity .35s, transform .35s; }
  .date-back { opacity: 0; transform: translateY(8px); pointer-events: none; }
  .flipped .date-front { opacity: 0; transform: translateY(-8px); pointer-events: none; }
  .flipped .date-back { opacity: 1; transform: none; pointer-events: auto; }
  .date-front { display: grid; grid-template-columns: auto 1fr; gap: 26px; align-items: center; }
  .bigday { font-family: "Instrument Serif", serif; font-size: clamp(88px, 22vw, 150px); line-height: .8; letter-spacing: -.03em; }
  .wd { font-size: clamp(18px, 4vw, 24px); font-weight: 600; letter-spacing: -.01em; }
  .my { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .stats { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .chip { font: 500 11px "Geist Mono", monospace; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--line); }
  .chip.hl { background: var(--accent-soft); border-color: transparent; color: var(--text); }
  .bar-row .top { display: flex; justify-content: space-between; margin-bottom: 5px; }
  .bar-row .top .mono { font-size: 11px; }
  .bar { height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 6px; background: var(--accent); transition: width .8s cubic-bezier(.2,.8,.2,1); }
  .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .cal-head b { font-weight: 600; font-size: 15px; }
  .cal-head button { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 8px; width: 26px; height: 26px; cursor: pointer; font-size: 13px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .cal span { font: 12px "Geist Mono", monospace; padding: 4px 0; border-radius: 7px; }
  .cal span.h { color: var(--muted); font-size: 10px; letter-spacing: .08em; }
  .cal span.o { opacity: .3; }
  .cal span.t { background: var(--accent); color: var(--panel); font-weight: 500; }
  :root[data-theme="dark"] .cal span.t { color: #101210; }
  @media (max-width: 380px) { .date-front { grid-template-columns: 1fr; gap: 8px; } }

  @media (prefers-reduced-motion: reduce) { .scan, .dot::after, .pin::before { animation: none; } }
</style>
</head>
<body>

<!-- ===== LOCATION ===== -->
<section class="widget" id="loc">
  <div class="card">
    <div id="map"></div>
    <div class="fade"></div>
    <div class="scan"></div>
    <button class="recenter" id="recenter">⌖ recenter</button>
    <div class="loc-data">
      <div>
        <span class="live"><span class="dot"></span><span class="label" id="loc-tag">Based in</span></span>
        <p class="city" id="city">Saarbrücken, Germany</p>
        <p class="coords" id="coords">49.2354° N, 6.9969° E</p>
      </div>
      <div class="loc-row">
        <p class="loc-time" id="loc-time">--:--<span class="s">:--</span></p>
        <p class="wx" id="wx"><span class="label">Weather</span><b>--°</b> <span id="wx-text">loading</span></p>
      </div>
    </div>
  </div>
</section>

<!-- ===== CLOCK ===== -->
<section class="widget" id="clock">
  <div class="card" id="clock-card" title="Click to switch 24h / 12h">
    <svg id="face" viewBox="0 0 200 200" aria-label="Analog clock">
      <circle cx="100" cy="100" r="96" fill="none" stroke="var(--line)" stroke-width="1.5"/>
      <g id="ticks"></g>
      <g id="nums" font-family="Geist Mono, monospace" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="central"></g>
      <text x="100" y="134" text-anchor="middle" font-family="Geist Mono, monospace" font-size="7.5" letter-spacing="1.5" fill="var(--muted)" id="face-date">---</text>
      <g id="h"><rect x="97.6" y="52" width="4.8" height="56" rx="2.4" fill="var(--hand)"/></g>
      <g id="m"><rect x="98.4" y="22" width="3.2" height="86" rx="1.6" fill="var(--hand)"/></g>
      <g id="s">
        <rect x="99.4" y="16" width="1.2" height="104" rx=".6" fill="var(--accent)"/>
        <circle cx="100" cy="122" r="3.4" fill="var(--accent)"/>
      </g>
      <circle cx="100" cy="100" r="4.2" fill="var(--accent)"/>
      <circle cx="100" cy="100" r="1.6" fill="var(--panel)"/>
    </svg>
    <div class="clock-side">
      <span class="label" id="clock-tag">Local time</span>
      <div class="digital" id="digital">--:--</div>
      <div>
        <div class="label" style="display:flex;justify-content:space-between"><span>Day</span><span id="day-pct">--%</span></div>
        <div class="daybar"><i id="day-bar" style="width:0"></i></div>
      </div>
      <div class="zones" id="zones"></div>
    </div>
    <span class="hint">click: 24h / 12h</span>
  </div>
</section>

<!-- ===== DATE ===== -->
<section class="widget" id="date">
  <div class="card" id="date-card" title="Click for month view">
    <div class="date-front">
      <div>
        <div class="bigday" id="bigday">--</div>
      </div>
      <div class="stats">
        <div>
          <div class="wd" id="weekday">--</div>
          <div class="my" id="monthyear">--</div>
          <div class="chips">
            <span class="chip hl" id="kw">KW --</span>
            <span class="chip" id="doy">Day ---</span>
          </div>
        </div>
        <div class="bar-row">
          <div class="top"><span class="label" id="sem-name">Semester</span><span class="mono" id="sem-pct">--%</span></div>
          <div class="bar"><i id="sem-bar" style="width:0"></i></div>
        </div>
        <div class="bar-row">
          <div class="top"><span class="label" id="yr-name">Year</span><span class="mono" id="yr-pct">--%</span></div>
          <div class="bar"><i id="yr-bar" style="width:0"></i></div>
        </div>
      </div>
    </div>
    <div class="date-back">
      <div class="cal-head">
        <button id="prev" aria-label="Previous month">‹</button>
        <b id="cal-title">--</b>
        <button id="next" aria-label="Next month">›</button>
      </div>
      <div class="cal" id="cal"></div>
    </div>
    <span class="hint">click: month view</span>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ---------------- Config via URL ----------------
   ?w=location|clock|date
   &theme=light|dark      (default: follows system)
   &bg=transparent        (blend into the Notion page)
   location: &city=...&lat=..&lon=..&tz=Europe/Berlin
   clock:    &tz=...  &zones=Asia/Karachi,America/New_York
   date:     &sem=2026-10-01,2027-03-31&semname=WS 26/27
------------------------------------------------- */
const q = new URLSearchParams(location.search);
const W = q.get('w') || document.documentElement.dataset.widget || 'location';
const theme = q.get('theme') || document.documentElement.dataset.defaultTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
document.documentElement.dataset.theme = theme;
if (q.get('bg') === 'transparent') document.body.classList.add('embed-transparent');
const TZ = q.get('tz') || 'Europe/Berlin';
const pad = n => String(n).padStart(2, '0');

function partsIn(tz, d = new Date()) {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-GB', {
    timeZone: tz, hour12: false, year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit', weekday: 'long'
  }).formatToParts(d).map(x => [x.type, x.value]));
  return { y: +p.year, mo: +p.month, d: +p.day, h: +p.hour % 24, m: +p.minute, s: +p.second, wd: p.weekday };
}
function tzAbbr(tz) {
  try {
    return new Intl.DateTimeFormat('en-GB', { timeZone: tz, timeZoneName: 'short' })
      .formatToParts(new Date()).find(p => p.type === 'timeZoneName').value;
  } catch { return ''; }
}

const sections = { location: 'loc', clock: 'clock', date: 'date' };
document.getElementById(sections[W] || 'loc').classList.add('on');

/* ---------------- LOCATION ---------------- */
if (W === 'location') {
  const lat = parseFloat(q.get('lat') || '49.2354');
  const lon = parseFloat(q.get('lon') || '6.9969');
  const city = q.get('city') || 'Saarbrücken, Germany';
  document.getElementById('city').textContent = city;
  document.getElementById('coords').textContent =
    `${Math.abs(lat).toFixed(4)}° ${lat >= 0 ? 'N' : 'S'}, ${Math.abs(lon).toFixed(4)}° ${lon >= 0 ? 'E' : 'W'}`;
  if (q.get('tag')) document.getElementById('loc-tag').textContent = q.get('tag');

  const start = [lat, lon - 0.022];                 // shift so the pin sits right of the text
  const map = L.map('map', {
    zoomControl: false, scrollWheelZoom: false, attributionControl: true,
    zoomSnap: 0.5
  }).setView(start, 13.5);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 16, attribution: 'Tiles © Esri'
  }).addTo(map);
  L.marker([lat, lon], {
    icon: L.divIcon({ className: '', html: '<div class="pin"><i></i></div>', iconSize: [14, 14], iconAnchor: [7, 7] })
  }).addTo(map);
  map.on('dblclick', () => {});
  document.getElementById('recenter').onclick = () => map.flyTo(start, 13.5, { duration: .8 });

  const tEl = document.getElementById('loc-time');
  const tick = () => {
    const p = partsIn(TZ);
    tEl.innerHTML = `${pad(p.h)}:${pad(p.m)}<span class="s">:${pad(p.s)}</span>`;
  };
  tick(); setInterval(tick, 1000);

  const WMO = {0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',51:'Drizzle',53:'Drizzle',55:'Drizzle',
    56:'Freezing drizzle',57:'Freezing drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',
    71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',80:'Showers',81:'Showers',82:'Heavy showers',85:'Snow showers',
    86:'Snow showers',95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'};
  const wx = async () => {
    try {
      const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,wind_speed_10m&timezone=auto`);
      const j = await r.json();
      const c = j.current;
      document.getElementById('wx').innerHTML =
        `<span class="label">Weather</span><b>${Math.round(c.temperature_2m)}°</b> ${WMO[c.weather_code] || ''} · ${Math.round(c.wind_speed_10m)} km/h`;
    } catch {
      document.getElementById('wx').innerHTML = `<span class="label">Timezone</span><b>${tzAbbr(TZ)}</b>`;
    }
  };
  wx(); setInterval(wx, 15 * 60 * 1000);
}

/* ---------------- CLOCK ---------------- */
if (W === 'clock') {
  const ticks = document.getElementById('ticks');
  for (let i = 0; i < 60; i++) {
    const major = i % 5 === 0;
    const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l.setAttribute('x1', 100); l.setAttribute('x2', 100);
    l.setAttribute('y1', major ? 9 : 10); l.setAttribute('y2', major ? 19 : 14);
    l.setAttribute('stroke', major ? 'var(--hand)' : 'var(--tick)');
    l.setAttribute('stroke-width', major ? 2.2 : 1);
    l.setAttribute('stroke-linecap', 'round');
    l.setAttribute('transform', `rotate(${i * 6} 100 100)`);
    ticks.appendChild(l);
  }
  const nums = document.getElementById('nums');
  [[12, 0], [3, 90], [6, 180], [9, 270]].forEach(([n, a]) => {
    const r = 70, rad = (a - 90) * Math.PI / 180;
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', 100 + r * Math.cos(rad)); t.setAttribute('y', 100 + r * Math.sin(rad));
    t.textContent = pad(n); nums.appendChild(t);
  });

  const zones = (q.get('zones') || '').split(',').filter(Boolean);
  const zEl = document.getElementById('zones');
  document.getElementById('clock-tag').textContent = q.get('label') || `Local · ${tzAbbr(TZ)}`;

  let h12 = false;
  try { h12 = localStorage.getItem('clock12') === '1'; } catch {}
  document.getElementById('clock-card').onclick = () => {
    h12 = !h12; try { localStorage.setItem('clock12', h12 ? '1' : '0'); } catch {}
    lastSec = -1;
  };

  const H = document.getElementById('h'), M = document.getElementById('m'), S = document.getElementById('s');
  const dig = document.getElementById('digital');
  const fd = document.getElementById('face-date');
  let lastSec = -1;
  const frame = () => {
    const now = new Date();
    const p = partsIn(TZ, now);
    const ms = now.getMilliseconds();
    const sec = p.s + ms / 1000;
    const min = p.m + sec / 60;
    const hr = (p.h % 12) + min / 60;
    S.setAttribute('transform', `rotate(${sec * 6} 100 100)`);
    M.setAttribute('transform', `rotate(${min * 6} 100 100)`);
    H.setAttribute('transform', `rotate(${hr * 30} 100 100)`);
    if (p.s !== lastSec) {
      lastSec = p.s;
      let hh = p.h, suf = '';
      if (h12) { suf = hh >= 12 ? 'PM' : 'AM'; hh = hh % 12 || 12; }
      dig.innerHTML = `${pad(hh)}:${pad(p.m)}<span class="sec">:${pad(p.s)}</span>${suf ? `<span class="ampm">${suf}</span>` : ''}`;
      fd.textContent = `${p.wd.slice(0, 3).toUpperCase()} ${pad(p.d)}`;
      const dayPct = ((p.h * 3600 + p.m * 60 + p.s) / 864).toFixed(0);
      document.getElementById('day-pct').textContent = dayPct + '%';
      document.getElementById('day-bar').style.width = dayPct + '%';
      zEl.innerHTML = zones.map(z => {
        const zp = partsIn(z, now);
        const name = z.split('/').pop().replace(/_/g, ' ');
        return `<span class="k">${name}</span><span>${pad(zp.h)}:${pad(zp.m)}</span>`;
      }).join('');
    }
    requestAnimationFrame(frame);
  };
  frame();
}

/* ---------------- DATE ---------------- */
if (W === 'date') {
  const card = document.getElementById('date-card');
  card.addEventListener('click', e => { if (!e.target.closest('button')) card.classList.toggle('flipped'); });

  const render = () => {
    const p = partsIn(TZ);
    const today = new Date(Date.UTC(p.y, p.mo - 1, p.d));
    document.getElementById('bigday').textContent = pad(p.d);
    document.getElementById('weekday').textContent = p.wd;
    document.getElementById('monthyear').textContent =
      today.toLocaleDateString('en-GB', { month: 'long', year: 'numeric', timeZone: 'UTC' });

    // ISO week (KW)
    const t = new Date(today); const dn = (t.getUTCDay() + 6) % 7;
    t.setUTCDate(t.getUTCDate() - dn + 3);
    const fy = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
    const kw = 1 + Math.round(((t - fy) / 864e5 - 3 + ((fy.getUTCDay() + 6) % 7)) / 7);
    document.getElementById('kw').textContent = `KW ${kw}`;

    const y0 = Date.UTC(p.y, 0, 1), y1 = Date.UTC(p.y + 1, 0, 1);
    const doy = Math.floor((today - y0) / 864e5) + 1;
    document.getElementById('doy').textContent = `Day ${doy}`;
    const yrPct = Math.round((today - y0) / (y1 - y0) * 100);
    document.getElementById('yr-name').textContent = `${p.y}`;
    document.getElementById('yr-pct').textContent = yrPct + '%';
    document.getElementById('yr-bar').style.width = yrPct + '%';

    // Semester: winter Oct 1 – Mar 31, summer Apr 1 – Sep 30 (override with ?sem=)
    let s0, s1, sname;
    if (q.get('sem')) {
      const [a, b] = q.get('sem').split(',');
      s0 = Date.parse(a + 'T00:00:00Z'); s1 = Date.parse(b + 'T23:59:59Z'); sname = q.get('semname') || 'Semester';
    } else if (p.mo >= 10 || p.mo <= 3) {
      const sy = p.mo >= 10 ? p.y : p.y - 1;
      s0 = Date.UTC(sy, 9, 1); s1 = Date.UTC(sy + 1, 2, 31, 23, 59, 59);
      sname = `WS ${String(sy).slice(2)}/${String(sy + 1).slice(2)}`;
    } else {
      s0 = Date.UTC(p.y, 3, 1); s1 = Date.UTC(p.y, 8, 30, 23, 59, 59); sname = `SS ${String(p.y).slice(2)}`;
    }
    const semPct = Math.max(0, Math.min(100, Math.round((today - s0) / (s1 - s0) * 100)));
    const left = Math.max(0, Math.ceil((s1 - today) / 864e5));
    document.getElementById('sem-name').textContent = `${sname} · ${left}d left`;
    document.getElementById('sem-pct').textContent = semPct + '%';
    document.getElementById('sem-bar').style.width = semPct + '%';
    return p;
  };
  let p = render();
  setInterval(() => { p = render(); }, 60 * 1000);

  // Month calendar (back side)
  let cy = p.y, cm = p.mo - 1;
  const drawCal = () => {
    const first = new Date(Date.UTC(cy, cm, 1));
    document.getElementById('cal-title').textContent =
      first.toLocaleDateString('en-GB', { month: 'long', year: 'numeric', timeZone: 'UTC' });
    const startDow = (first.getUTCDay() + 6) % 7;
    const days = new Date(Date.UTC(cy, cm + 1, 0)).getUTCDate();
    const prevDays = new Date(Date.UTC(cy, cm, 0)).getUTCDate();
    let html = ['MO','TU','WE','TH','FR','SA','SU'].map(d => `<span class="h">${d}</span>`).join('');
    for (let i = startDow; i > 0; i--) html += `<span class="o">${prevDays - i + 1}</span>`;
    for (let d = 1; d <= days; d++) {
      const isT = d === p.d && cm === p.mo - 1 && cy === p.y;
      html += `<span class="${isT ? 't' : ''}">${d}</span>`;
    }
    const tail = (7 - ((startDow + days) % 7)) % 7;
    for (let d = 1; d <= tail; d++) html += `<span class="o">${d}</span>`;
    document.getElementById('cal').innerHTML = html;
  };
  drawCal();
  document.getElementById('prev').onclick = e => { e.stopPropagation(); cm--; if (cm < 0) { cm = 11; cy--; } drawCal(); };
  document.getElementById('next').onclick = e => { e.stopPropagation(); cm++; if (cm > 11) { cm = 0; cy++; } drawCal(); };
}
</script>
</body>
</html>
